{% extends 'layout.html' %}
{% block title %}Orders{% endblock %}
{% block content %}
<h2>Your orders</h2>
<table class="table"><tr><th>ID</th><th>Total</th><th>Status</th><th>Date</th></tr>
{% for o in orders %}<tr><td><a href="{{ url_for('account.order_detail', order_id=o[0]) }}">{{ o[0] }}</a></td><td>${{ '%.2f'|format(o[1]) }}</td><td>{{ o[2] }}</td><td>{{ o[3] }}</td></tr>{% endfor %}</table>
{% endblock %}
