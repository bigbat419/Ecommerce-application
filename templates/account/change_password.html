{% extends 'layout.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Change Password</h2>
    <div class="card">
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input class="form-control" name="current_password" type="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input class="form-control" name="new_password" type="password" required minlength="6">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input class="form-control" name="confirm_password" type="password" required minlength="6">
          </div>
          <button class="btn btn-primary" type="submit">Update Password</button>
          <a href="{{ url_for('account.edit_profile') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
