{% extends 'layout.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-header">
  <div class="container">
    <h1>Change Password</h1>
    <ol class="breadcrumb mt-1"><li><a href="{{ url_for('index') }}">Home</a></li><li><a href="{{ url_for('account.profile') }}">Account</a></li><li>Password</li></ol>
  </div>
</div>
<div class="container pb-5">
  <div class="d-flex gap-4 align-items-start flex-column flex-lg-row">
    {% include 'account/_sidebar.html' %}
    <div class="flex-grow-1">
      <div class="card" style="max-width:520px;">
        <div class="card-header"><i class="bi bi-lock me-2 text-p"></i>Update Password</div>
        <div class="card-body">
          <form method="post" action="{{ url_for('account.change_password') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label class="form-label-sm">Current Password</label>
              <input class="form-input" type="password" name="current_password" required placeholder="Enter current password">
            </div>
            <div class="mb-3">
              <label class="form-label-sm">New Password</label>
              <input class="form-input" id="newPw" type="password" name="new_password" required minlength="6" placeholder="Min. 6 characters" oninput="strengthCheck(this.value)">
              <div style="height:4px;background:var(--grey-200);border-radius:2px;margin-top:.4rem;overflow:hidden;">
                <div id="strengthBar" style="height:100%;width:0;border-radius:2px;transition:.3s;"></div>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label-sm">Confirm New Password</label>
              <input class="form-input" type="password" name="confirm_password" required minlength="6" placeholder="Repeat new password">
            </div>
            <button type="submit" class="btn-p"><i class="bi bi-check2 me-1"></i>Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function strengthCheck(v){
  let s=0;
  if(v.length>=6)s++;if(v.length>=10)s++;if(/[A-Z]/.test(v))s++;if(/[0-9]/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const b=document.getElementById('strengthBar');
  const c=['#EF4444','#F59E0B','#F59E0B','#22C55E','#22C55E'];
  const p=['20%','40%','60%','80%','100%'];
  b.style.width=v.length?p[Math.max(0,s-1)]:'0';
  b.style.background=c[Math.max(0,s-1)];
}
</script>
{% endblock %}
