{% extends 'layout.html' %}
{% block title %}Addresses{% endblock %}
{% block content %}
<h2>Addresses</h2>
<form method="post">
  {{ csrf_token() }}
  <div class="mb-3"><input class="form-control" name="label" placeholder="Label"></div>
  <div class="mb-3"><input class="form-control" name="line1" placeholder="Line 1"></div>
  <div class="mb-3"><input class="form-control" name="city" placeholder="City"></div>
  <div class="mb-3"><input class="form-control" name="country" placeholder="Country"></div>
  <button class="btn btn-secondary" type="submit">Add address</button>
</form>
<ul class="mt-3">
{% for a in addresses %}<li>{{ a[1] }} - {{ a[2] }}, {{ a[3] }}, {{ a[4] }}</li>{% endfor %}
</ul>
{% endblock %}
