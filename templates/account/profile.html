{% extends 'layout.html' %}
{% block title %}My Account{% endblock %}
{% block content %}
<h2 class="mb-4">My Account</h2>
<div class="row g-3">
  <div class="col-md-3">
    <div class="list-group">
      <a href="{{ url_for('account.edit_profile') }}" class="list-group-item list-group-item-action">Profile</a>
      <a href="{{ url_for('account.change_password') }}" class="list-group-item list-group-item-action">Change Password</a>
      <a href="{{ url_for('account.orders') }}" class="list-group-item list-group-item-action">Orders</a>
      <a href="{{ url_for('account.addresses') }}" class="list-group-item list-group-item-action">Addresses</a>
    </div>
  </div>
  <div class="col-md-9">
    <div class="card">
      <div class="card-body">
        <h5>Welcome, {{ user.name }}</h5>
        <p class="text-muted">{{ user.email }}</p>
        <a href="{{ url_for('account.edit_profile') }}" class="btn btn-outline-primary btn-sm">Edit Profile</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
