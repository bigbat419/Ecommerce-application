{% extends 'layout.html' %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Edit Product</h2>
      <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" name="name" value="{{ product.name }}" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Price (₦)</label>
              <input class="form-control" name="price" type="number" step="0.01" min="0" value="{{ product.price }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Stock</label>
              <input class="form-control" name="stock" type="number" min="0" value="{{ product.stock }}" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input class="form-control" name="category" value="{{ product.category or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4">{{ product.description or '' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Image</label>
            {% if product.image %}
              <div class="mb-2">
                <img src="{{ url_for('static', filename=product.image) }}" style="height:80px;object-fit:cover;" class="rounded">
              </div>
            {% endif %}
            <input class="form-control" name="image" type="file" accept="image/*">
            <div class="form-text">Leave blank to keep current image.</div>
          </div>
          <button class="btn btn-primary" type="submit">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
