{% extends 'layout.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Add Product</h2>
      <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary btn-sm">← Back</a>
    </div>
    <div class="card">
      <div class="card-body">
        <form method="post" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <input class="form-control" name="name" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Price (₦) <span class="text-danger">*</span></label>
              <input class="form-control" name="price" type="number" step="0.01" min="0" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Stock <span class="text-danger">*</span></label>
              <input class="form-control" name="stock" type="number" min="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input class="form-control" name="category" placeholder="e.g. Electronics, Clothing">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Image</label>
            <input class="form-control" name="image" type="file" accept="image/*">
          </div>
          <button class="btn btn-primary" type="submit">Add Product</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
