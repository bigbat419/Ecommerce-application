{% extends "layout.html" %}
{% block title %}Payment Cancelled{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="mb-3 text-danger" style="font-size:4rem;">&#10007;</div>
  <h3>Payment Cancelled</h3>
  <p class="text-muted">Your payment was not completed. Your cart is still saved.</p>
  <a href="{{ url_for('checkout.checkout') }}" class="btn btn-primary me-2">Try Again</a>
  <a href="{{ url_for('cart.view_cart') }}" class="btn btn-outline-secondary">Back to Cart</a>
</div>
{% endblock %}
