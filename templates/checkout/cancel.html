{% extends 'layout.html' %}
{% block title %}Payment Cancelled{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="success-page">
    <div class="success-icon" style="background:#FEF9C3;">⚠️</div>
    <h2>Payment Cancelled</h2>
    <p class="text-muted fs-sm mb-4" style="max-width:380px;margin:0 auto 1.5rem;">
      Your payment was not completed. Your cart items are still saved — you can try again anytime.
    </p>
    <div class="d-flex flex-wrap gap-3 justify-content-center">
      <a href="{{ url_for('checkout.checkout') }}" class="btn-p btn-lg">
        <i class="bi bi-arrow-counterclockwise me-2"></i>Try Again
      </a>
      <a href="{{ url_for('cart.view_cart') }}" class="btn-outline btn-lg">Back to Cart</a>
    </div>
    <p class="mt-4 fs-xs text-muted">
      Need help? <a href="#" class="text-p fw-600">Contact our support team</a>
    </p>
  </div>
</div>
{% endblock %}
